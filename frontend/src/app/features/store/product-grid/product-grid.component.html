<div class="store-hero">
    <div class="hero-content">
        <h1 class="hero-title">{{ 'STORE.HERO_TITLE' | translate }}</h1>
        <p class="hero-subtitle">{{ 'STORE.HERO_SUBTITLE' | translate }}</p>
    </div>
</div>

<!-- Sort Controls -->
<div class="sort-controls-container">
    <div class="sort-label">{{ 'STORE.SORT_BY' | translate }}:</div>
    <div class="sort-buttons">
        <button mat-stroked-button type="button" class="sort-button" [disableRipple]="true"
            [class.active-sort]="isActiveSort('code')" (click)="setSortField('code')">
            <mat-icon>{{ getSortIcon('code') }}</mat-icon>
            {{ 'STORE.SORT_CODE' | translate }}
        </button>
        <button mat-stroked-button type="button" class="sort-button" [disableRipple]="true"
            [class.active-sort]="isActiveSort('name')" (click)="setSortField('name')">
            <mat-icon>{{ getSortIcon('name') }}</mat-icon>
            {{ 'STORE.SORT_NAME' | translate }}
        </button>
        <button mat-stroked-button type="button" class="sort-button" [disableRipple]="true"
            [class.active-sort]="isActiveSort('category')" (click)="setSortField('category')">
            <mat-icon>{{ getSortIcon('category') }}</mat-icon>
            {{ 'STORE.SORT_CATEGORY' | translate }}
        </button>
        <button mat-stroked-button type="button" class="sort-button" [disableRipple]="true"
            [class.active-sort]="isActiveSort('price')" (click)="setSortField('price')">
            <mat-icon>{{ getSortIcon('price') }}</mat-icon>
            {{ 'STORE.SORT_PRICE' | translate }}
        </button>
        <button mat-stroked-button type="button" class="sort-button" [disableRipple]="true"
            [class.active-sort]="isActiveSort('date')" (click)="setSortField('date')">
            <mat-icon>{{ getSortIcon('date') }}</mat-icon>
            {{ 'STORE.SORT_DATE' | translate }}
        </button>
    </div>
</div>

<div class="product-grid" [@listAnimation]="sortedItems().length">
    @for (item of sortedItems(); track item.id) {
    <app-product-card [item]="item"></app-product-card>
    } @empty {
    <div class="empty-state">
        <mat-icon class="empty-icon">inventory_2</mat-icon>
        <h3>{{ 'STORE.NO_PRODUCTS' | translate }}</h3>
        <p>{{ 'STORE.NO_PRODUCTS_HINT' | translate }}</p>
    </div>
    }
</div>
